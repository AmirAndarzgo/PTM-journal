<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="author" content="Amir Andarzgo"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PTM Journal — tarane.trade</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0a0a0a;--ink:#ededed;--mut:#8b8b8b;--gold:#c9a227;--gold2:#f0c040;--line:#1d1d1d;--ok:#2e8b57;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0a0a0a;--ink:#ededed;--mut:#8b8b8b;--line:#1d1d1d}}
:root[data-theme="dark"]{--bg:#000;--card:#0a0a0a;--ink:#ededed;--mut:#8b8b8b;--line:#1d1d1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
header{background:#000;color:#fff;padding:22px 16px 0;border-bottom:3px solid var(--gold2)}
.brand{max-width:960px;margin:auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px}.brand span{color:#9a9a9a;font-size:13px}
.brand b{margin-inline-start:auto;font:800 18px Vazirmatn,sans-serif;background:linear-gradient(#fff 40%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
nav{max-width:960px;margin:14px auto 0;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#9a9a9a;font:600 14px Vazirmatn,sans-serif;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--gold2);border-color:var(--gold2)}
main{max-width:960px;margin:20px auto;padding:0 14px 60px}
h2{font-size:19px;margin:6px 0 14px}h3{font-size:15px;margin:0 0 10px;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.st small{color:var(--mut);display:block;font-size:12px}.st b{font-size:21px;direction:ltr;display:block;text-align:right}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.go button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 10px;font:600 15px Vazirmatn,sans-serif;color:var(--ink);cursor:pointer}.go button:hover{border-color:var(--gold2)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}form .w{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:3px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--ink);cursor:pointer}.chip input{width:auto;margin:0}
.btn{background:var(--gold2);color:#16130c;border:0;border-radius:8px;padding:10px 20px;font:800 15px Vazirmatn,sans-serif;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:5px}.bar span{min-width:130px;direction:ltr;text-align:right;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600}
.p{color:var(--ok)}.n{color:var(--bad)}.x{background:none;border:0;color:var(--mut);cursor:pointer}.em{color:var(--mut);text-align:center;padding:18px}

<div id="fsb"></div><main id="m"></main><div id="lb"></div><footer class="cr">طراحی و ساخت: <bdi dir="ltr"><b>Amir Andarzgo</b></bdi> · <bdi dir="ltr">tarane.trade</bdi></footer>
<script>
const K='ptm1';let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{};['t','b','d'].forEach(k=>db[k]=db[k]||[]);db.r=db.r||{};db.g=db.g||'';
const save=()=>{db.u=Date.now();try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}fsQ()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),f1=x=>(+x).toFixed(1);
const EM=['FOMO','Revenge','Fear','Greed','Overconfidence','Early Exit','Rule Breaking','Impulsive Entry'];
const MOOD=['Calm','Focused','Neutral','Anxious','Fearful','Greedy','FOMO','Angry'];
const CH=['طبق پلن ماندم','حد ضرر را تغییر ندادم','حجم را تغییر ندادم','زود خارج نشدم','تصمیم احساسی نگرفتم'];
const TABS=[['home','🏠 داشبورد'],['trade','➕ ثبت معامله'],['perf','📊 عملکرد من'],['psy','🧠 روانشناسی'],['day','📅 مرور روزانه'],['week','📆 مرور هفتگی'],['bt','🔬 Backtest'],['rules','⭐ قوانین من'],['bk','💾 پشتیبان']];
const F=(n,l,t='text',o,c='')=>`<label class="${c}">${l}`+(t=='sel'?`<select name="${n}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:t=='area'?`<textarea name="${n}" rows="2"></textarea>`:`<input name="${n}" type="${t}"${t=='number'?' step="any"':''}${t=='date'?` value="${today()}"`:''}>`)+'</label>';
const CB=(n,a)=>`<div class="chips w">${a.map(x=>`<label class="chip"><input type="checkbox" name="${n}" value="${x}">${x}</label>`).join('')}</div>`;
const S=l=>{const n=l.length,R=l.map(x=>+x.r||0),tot=R.reduce((a,b)=>a+b,0),c=k=>l.filter(x=>x.res==k).length,by={};
l.forEach(x=>by[x.date]=(by[x.date]||0)+(+x.r||0));const ds=Object.entries(by);let cw=0,cl=0,mw=0,ml=0;
l.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(x=>{const r=+x.r||0;if(r>0){cw++;cl=0}else if(r<0){cl++;cw=0}else cw=cl=0;mw=Math.max(mw,cw);ml=Math.max(ml,cl)});
const rk=l.filter(x=>x.risk!=='').map(x=>+x.risk);
return{n,wr:n?R.filter(r=>r>0).length/n*100:0,tot,avg:n?tot/n:0,tp:c('TP'),sl:c('SL'),be:c('BE'),risk:rk.length?rk.reduce((a,b)=>a+b,0)/rk.length:0,
best:ds.sort((a,b)=>b[1]-a[1])[0],worst:ds.sort((a,b)=>a[1]-b[1])[0],mw,ml,pf:n?l.filter(x=>x.plan=='Yes').length/n*100:0}};
const E=l=>{const o={};EM.forEach(e=>o[e]=0);l.forEach(x=>(x.em||[]).forEach(e=>o[e]++));return o};
const st=(l,v)=>`<div class="st"><small>${l}</small><b>${v}</b></div>`;
const bars=o=>{const mx=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="bar"><span>${k} — ${v}</span><i style="width:${v/mx*60}%"></i></div>`).join('')};
const perfCards=s=>`<div class="grid">${st('تعداد معاملات',s.n)+st('وین‌ریت',f1(s.wr)+'%')+st('مجموع R',f1(s.tot))+st('میانگین R',f1(s.avg))+st('TP / SL / BE',`${s.tp}/${s.sl}/${s.be}`)+st('میانگین ریسک',f1(s.risk)+'%')+st('بهترین روز',s.best?f1(s.best[1])+'R':'—')+st('بدترین روز',s.worst?f1(s.worst[1])+'R':'—')+st('برد متوالی',s.mw)+st('باخت متوالی',s.ml)+st('رعایت پلن',f1(s.pf)+'%')}</div>`;
const setups=l=>{const o={};l.forEach(x=>{if(x.setup)o[x.setup]=(o[x.setup]||0)+(+x.r||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const wk=()=>{const d=new Date(Date.now()-7*864e5).toISOString().slice(0,10);return db.t.filter(x=>x.date>=d)};
const R={
home:()=>`<h2>امروز از کجا شروع کنم؟</h2><div class="go">${TABS.slice(1).map(([k,l])=>`<button data-go="${k}">${l}</button>`).join('')}</div>
<div class="card" style="margin-top:14px"><h3>خلاصه</h3>${perfCards(S(db.t))}</div>`,
trade:()=>`<h2>ثبت معامله</h2><form class="card" id="f-trade"><h3 class="w">قبل از معامله</h3>${F('date','تاریخ','date')+F('symbol','Symbol')+F('setup','Setup')+F('session','Session','sel',['London','New York','Asia','Overlap'])+F('tf','Timeframe')+F('dir','Direction','sel',['Long','Short'])+F('entry','Entry','number')+F('sl','SL','number')+F('tp','TP','number')+F('risk','Risk %','number')+F('why','چرا وارد شدم؟','area',0,'w')+F('mood','وضعیت ذهنی من','sel',MOOD)}
<h3 class="w">حین معامله</h3>${CB('ch',CH)}<h3 class="w">بعد از معامله</h3>${F('res','Result','sel',['TP','SL','BE','Partial'])+F('r','Result R','number')+F('plan','رعایت پلن؟','sel',['Yes','No','Partial'])}<h3 class="w">احساسات و خطاهای این معامله</h3>${CB('em',EM)}${F('mistake','بزرگ‌ترین اشتباه؟','area',0,'w')+F('lesson','مهم‌ترین چیزی که یاد گرفتم؟','area',0,'w')}<label class="w">📸 عکس چارت (حداکثر ۲ عکس: قبل و بعد از معامله)<input type="file" id="chartf" accept="image/*" multiple></label><div class="w"><button class="btn">ذخیره معامله</button></div></form>${tbl()}`,
perf:()=>{const l=db.t,s=S(l),su=setups(l);return`<h2>عملکرد من</h2>${perfCards(s)}<div class="card" style="margin-top:14px"><h3>R هر Setup</h3>${su.length?su.map(([k,v])=>`<div class="bar"><span>${esc(k)} — ${f1(v)}R</span></div>`).join(''):'<div class="em">هنوز معامله‌ای ثبت نشده.</div>'}</div>`},
psy:()=>{const o=E(db.t);return`<h2>روانشناسی معاملات</h2><div class="card"><h3>الگوهای رفتاری من</h3>${db.t.length?bars(o):'<div class="em">با ثبت معامله‌ها، مشکل اصلی‌ات اینجا مشخص می‌شود.</div>'}</div><div class="card"><h3>وضعیت ذهنی قبل از ورود</h3>${bars(Object.fromEntries(MOOD.map(m=>[m,db.t.filter(x=>x.mood==m).length])))}</div>`},
day:()=>`<h2>مرور روزانه</h2><form class="card" id="f-day">${F('date','تاریخ','date')+F('n','امروز چند معامله کردم؟','number')+F('pl','چندتا طبق پلن بود؟','number')+F('feel','احساس غالب امروز','sel',MOOD)+F('best','بهترین تصمیم امروز؟','area',0,'w')+F('worst','بدترین تصمیم امروز؟','area',0,'w')+F('fomo','FOMO داشتم؟','sel',['خیر','بله'])+F('rev','Revenge داشتم؟','sel',['خیر','بله'])+F('brk','قوانینم را شکستم؟','sel',['خیر','بله'])+F('tom','🎯 فردا روی چه چیزی تمرکز می‌کنم؟','area',0,'w')}<div class="w"><button class="btn">ذخیره مرور روز</button></div></form>${list(db.d,'d',['date','n','pl','feel','tom'])}`,
week:()=>{const l=wk(),s=S(l),su=setups(l),o=E(l),top=Object.entries(o).sort((a,b)=>b[1]-a[1])[0];return`<h2>مرور هفتگی (۷ روز اخیر)</h2><div class="grid">${st('تعداد معاملات',s.n)+st('وین‌ریت',f1(s.wr)+'%')+st('مجموع R',f1(s.tot))+st('بهترین ستاپ',su[0]?esc(su[0][0]):'—')+st('ضعیف‌ترین ستاپ',su.length>1?esc(su[su.length-1][0]):'—')+st('رایج‌ترین اشتباه',top&&top[1]?top[0]:'—')+st('تخلف از قوانین',o['Rule Breaking']+l.filter(x=>x.plan=='No').length)}</div><div class="card" style="margin-top:14px"><h3>احساسات این هفته</h3>${bars(o)}</div><div class="card"><h3>هدف هفته بعد</h3><textarea id="goal" rows="3" style="width:100%">${esc(db.g)}</textarea><br><br><button class="btn" id="sg">ذخیره هدف</button></div>`},
bt:()=>{const b=S(db.b),t=S(db.t);return`<h2>Backtest</h2><form class="card" id="f-bt">${F('date','Date','date')+F('symbol','Symbol')+F('setup','Setup')+F('session','Session','sel',['London','New York','Asia','Overlap'])+F('dir','Direction','sel',['Long','Short'])+F('res','Result','sel',['TP','SL','BE','Partial'])+F('r','R','number')+F('cond','Market Condition','sel',['Trend','Range','Volatile','News'])+F('plan','Rules Followed','sel',['Yes','No','Partial'])+F('shot','Screenshot (لینک)')+F('note','Notes','area',0,'w')}<div class="w"><button class="btn">ذخیره بک‌تست</button></div></form>
<div class="card"><h3>مقایسه Backtest با معاملات واقعی</h3><div class="grid">${st('بک‌تست — وین‌ریت',f1(b.wr)+'%')+st('واقعی — وین‌ریت',f1(t.wr)+'%')+st('بک‌تست — میانگین R',f1(b.avg))+st('واقعی — میانگین R',f1(t.avg))}</div></div>${list(db.b,'b',['date','symbol','setup','res','r','cond'])}`},
rules:()=>{const q=[['risk','Risk per Trade'],['dl','Maximum Daily Loss'],['mt','Maximum Trades'],['su','My Setups'],['nt','No-Trade Conditions'],['al','After Loss Protocol'],['aw','After Winning Streak Protocol']];
return`<h2>قوانین معاملاتی من</h2><form class="card" id="f-rules">${q.map(([k,l])=>`<label class="w">${l}<textarea name="${k}" rows="2">${esc(db.r[k])}</textarea></label>`).join('')}<div class="w"><button class="btn">ذخیره قوانین</button></div></form>`}};
function list(a,k,cols){return`<div class="card tw"><h3>سوابق</h3>${a.length?`<table><tr>${cols.map(c=>`<th>${HN[c]||c}</th>`).join('')}<th></th></tr>${a.map((x,i)=>`<tr>${cols.map(c=>`<td class="${c=='r'?(+x[c]>0?'p':+x[c]<0?'n':''):''}">${c=='imgs'?(x.imgs||[]).map(i=>`<img class="th" data-img="${esc(i)}" alt="">`).join(''):esc(x[c])}</td>`).join('')}<td><button class="x" data-del="${k}:${i}">حذف</button></td></tr>`).reverse().join('')}</table>`:'<div class="em">هنوز چیزی ثبت نشده.</div>'}</div>`}
const HN={date:'تاریخ',symbol:'نماد',setup:'ستاپ',dir:'جهت',res:'نتیجه',r:'R',plan:'پلن',n:'تعداد',pl:'طبق پلن',feel:'احساس',tom:'تمرکز فردا',cond:'شرایط',imgs:'چارت'};
const tbl=()=>list(db.t,'t',['date','symbol','setup','dir','res','r','plan','imgs']);
const HERO={home:['f','PTM JOURNAL','ژورنال ذهن معامله‌گر حرفه‌ای — ثبت کن، تحلیل کن، اصلاح کن'],trade:['f','ثبت معامله','قبل، حین و بعد از معامله را صادقانه ثبت کن'],perf:['b','عملکرد من','اعداد دروغ نمی‌گویند'],psy:['b','روانشناسی معاملات','مشکل اصلی‌ات را پیدا کن'],day:['f','مرور روزانه','امروز چطور بود؟ فردا چه چیزی را بهتر می‌کنی؟'],week:['b','مرور هفتگی','الگوها را در یک هفته ببین'],bt:['f','Backtest','قبل از پول واقعی، سیستم را بسنج'],rules:['r','قوانین من','ریسک را مدیریت کن؛ سود خودش می‌آید'],bk:['f','پشتیبان‌گیری','داده‌هایت را نگه دار']};
const hero=t=>{const[h,a,b]=HERO[t];return`<div class="hero ${h}"><h2>${a}</h2><p>${b}</p></div>`};
R.bk=()=>`<div class="card"><h3>💽 ذخیره‌ی خودکار روی سیستم (پیشنهادی)</h3><p style="margin:0 0 10px">یک پوشه روی کامپیوترت انتخاب کن (مثلاً Documents/PTM). ژورنال بعد از هر تغییر خودکار داخل آن ذخیره می‌شود و یک نسخه‌ی پشتیبان روزانه هم در پوشه‌ی backups ساخته می‌شود.</p><button class="btn" id="fspick">انتخاب پوشه</button><p id="fss" style="margin:10px 0 0"></p><p style="color:var(--mut);font-size:12px;margin:6px 0 0">همه‌چیز (متن‌ها و عکس چارت‌ها) داخل همین پوشه ذخیره می‌شود؛ عکس‌ها در زیرپوشه‌ی charts. اگر مرورگر یا دستگاه عوض شد، فایل را باز کن و همین پوشه را دوباره انتخاب کن تا همه‌چیز برگردد. فقط Chrome یا Edge روی کامپیوتر. بعد از بستن و باز کردن مرورگر، یک‌بار «فعال‌سازی دوباره» را بزن.</p></div><div class="card"><h3>روش دستی: کپی داده‌ها</h3><p style="color:var(--mut);margin:0 0 8px">همه‌ی ژورنال تو در این متن است. آن را کپی کن و جای امنی نگه دار (مثلاً یادداشت‌های گوشی).</p><textarea rows="6" readonly onfocus="this.select()" style="width:100%">${esc(JSON.stringify(db))}</textarea></div><div class="card"><h3>بازگردانی</h3><label>از فایل (ptm-journal.json یا یکی از فایل‌های backups)<input type="file" accept=".json" id="fsf"></label><br><textarea id="bi" rows="4" style="width:100%" placeholder="متن پشتیبان را اینجا بچسبان"></textarea><br><br><button class="btn" id="rs">بازگردانی</button></div>`;

let FH=null,FS={ok:false,msg:'',t:''},fT=0;
const cnt=o=>(o.t||[]).length+(o.b||[]).length+(o.d||[]).length;
const adopt=o=>{if(!o||!Array.isArray(o.t))throw 0;db=o;['t','b','d'].forEach(k=>db[k]=db[k]||[]);db.r=db.r||{};db.g=db.g||'';try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const idb=(m,v)=>new Promise((res,rej)=>{const r=indexedDB.open('ptmfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const d=r.result,s=d.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),q=m=='get'?s.get('dir'):s.put(v,'dir');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}});
async function fsPerm(ask){if(!FH)return false;const o={mode:'readwrite'};try{if(await FH.queryPermission(o)==='granted')return true;if(ask&&await FH.requestPermission(o)==='granted')return true}catch(e){}return false}
async function fsWrite(){const j=JSON.stringify(db);let f=await FH.getFileHandle('ptm-journal.json',{create:true}),w=await f.createWritable();await w.write(j);await w.close();
const bd=await FH.getDirectoryHandle('backups',{create:true}),n='ptm-backup-'+today()+'.json';let old=0;
try{old=cnt(JSON.parse(await(await(await bd.getFileHandle(n)).getFile()).text()))}catch(e){}
if(cnt(db)>=old){f=await bd.getFileHandle(n,{create:true});w=await f.createWritable();await w.write(j);await w.close()}
FS={ok:true,msg:'',t:new Date().toLocaleTimeString('fa-IR')}}
async function fsSync(pick){try{let o=null;try{o=JSON.parse(await(await(await FH.getFileHandle('ptm-journal.json')).getFile()).text())}catch(e){}
if(o&&Array.isArray(o.t)&&(pick?cnt(o)>0:(o.u||0)>(db.u||0))){if(pick&&cnt(db)>0&&db.u!==o.u)await fsStash();adopt(o);show(cur)}await fsWrite();await fsImgAll()}catch(e){FS={ok:false,msg:'خطا در ذخیره ('+e.name+')'}}}
function fsQ(){if(!FH)return;clearTimeout(fT);fT=setTimeout(async()=>{if(await fsPerm(false)){try{await fsWrite()}catch(e){FS={ok:false,msg:'خطا در ذخیره ('+e.name+')'}}}else FS={ok:false,msg:'اجازه‌ی دسترسی به پوشه قطع شده است'};fsUI()},500)}
function fsUI(){const b=document.getElementById('fsb'),s=document.getElementById('fss');
const t=!FH?(FS.msg?'⚠️ '+esc(FS.msg):''):FS.ok?'✅ ژورنال روی سیستم ذخیره می‌شود · پوشه: '+esc(FH.name)+' · آخرین ذخیره: '+FS.t:'⚠️ '+esc(FS.msg||'برای ادامه‌ی ذخیره روی سیستم، دکمه را بزن');
const W=x=>'<div class="fsw">'+x+'</div>',sup=!!window.showDirectoryPicker;
if(b)b.innerHTML=FH?(FS.ok?'':W(t+' <button class="btn" id="fsr">فعال‌سازی دوباره</button>')):W(sup?(t?t+' ':'💽 برای امنیت ژورنال، یک پوشه روی دستگاهت انتخاب کن تا همه‌چیز (متن‌ها و عکس‌ها) آنجا ذخیره شود. ')+'<button class="btn" id="fspick">انتخاب پوشه</button>':'ℹ️ این مرورگر ذخیره روی پوشه را پشتیبانی نمی‌کند؛ ژورنال داخل مرورگر ذخیره می‌شود. هفته‌ای یک‌بار از تب «💾 پشتیبان» کپی بگیر.');
if(s)s.innerHTML=t||'هنوز پوشه‌ای انتخاب نشده.'}
async function fsPick(){if(!window.showDirectoryPicker){FH=null;FS={ok:false,msg:'این مرورگر پشتیبانی نمی‌کند. از Chrome یا Edge روی کامپیوتر استفاده کن.'};fsUI();return}
try{const h=await showDirectoryPicker({mode:'readwrite'});FH=h;await idb('put',h);await fsSync(true)}catch(e){if(e.name!='AbortError'){FH=null;FS={ok:false,msg:'مرورگر اجازه نداد ('+e.name+'). فایل ژورنال را روی کامپیوتر خودت ذخیره کن و از آنجا در Chrome باز کن.'}}}fsUI()}
async function fsInit(){try{FH=(await idb('get'))||null}catch(e){}if(FH){if(await fsPerm(false))await fsSync();else FS={ok:false,msg:''}}fsUI()}
document.addEventListener('click',async e=>{const id=e.target.id;if(id=='fspick')fsPick();if(id=='fsr'){if(await fsPerm(true))await fsSync();else FS={ok:false,msg:'اجازه داده نشد'};fsUI()}});
document.addEventListener('change',async e=>{if(e.target.id=='fsf'){try{adopt(JSON.parse(await e.target.files[0].text()));save();show('home')}catch(x){e.target.value='';alert('فایل نامعتبر است')}}});

const IDBI=(m,k,v)=>new Promise((res,rej)=>{const r=indexedDB.open('ptmimg',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const s=r.result.transaction('i',m=='get'?'readonly':'readwrite').objectStore('i'),q=m=='get'?s.get(k):m=='del'?s.delete(k):s.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}});
const shrink=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(0),'image/jpeg',.74)};im.onerror=()=>rej(0);im.src=u});
async function hydrate(){for(const i of document.querySelectorAll('img[data-img]')){const b=await getImg(i.dataset.img);if(b)i.src=URL.createObjectURL(b);else i.alt='—'}}
document.addEventListener('click',e=>{const lb=document.getElementById('lb');if(e.target.classList.contains('th')){lb.innerHTML='<img src="'+e.target.src+'" alt="">';lb.style.display='flex'}else if(e.target===lb||lb.contains(e.target))lb.style.display='none'});
async function fsImg(id,b){if(FH&&await fsPerm(false)){try{const d=await FH.getDirectoryHandle('charts',{create:true}),w=await(await d.getFileHandle(id+'.jpg',{create:true})).createWritable();await w.write(b);await w.close();return true}catch(e){}}return false}
async function saveImgs(inp){const ids=[];for(const f of[...(inp&&inp.files||[])].slice(0,2)){try{const b=await shrink(f),id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);if(!(await fsImg(id,b)))await IDBI('put',id,b);ids.push(id)}catch(e){}}return ids}
async function fsImgAll(){for(const t of db.t)for(const id of t.imgs||[]){try{const d=await FH.getDirectoryHandle('charts',{create:true});let ok=true;try{await d.getFileHandle(id+'.jpg')}catch(e){ok=false;const b=await IDBI('get',id);if(b)ok=await fsImg(id,b)}if(ok)IDBI('del',id).catch(()=>{})}catch(e){}}}
async function getImg(id){let b=null;if(FH&&await fsPerm(false)){try{b=await(await(await FH.getDirectoryHandle('charts')).getFileHandle(id+'.jpg')).getFile()}catch(e){}}
if(!b){try{b=await IDBI('get',id)}catch(e){}}return b}
async function fsStash(){try{const bd=await FH.getDirectoryHandle('backups',{create:true}),w=await(await bd.getFileHandle('ptm-local-before-switch-'+Date.now()+'.json',{create:true})).createWritable();await w.write(JSON.stringify(db));await w.close()}catch(e){}}
let cur='home';
function show(t){cur=t;$n.innerHTML=TABS.map(([k,l])=>`<button class="${k==t?'on':''}" data-go="${k}">${l}</button>`).join('');m.innerHTML=hero(t)+R[t]();fsUI();hydrate();scrollTo(0,0)}
const $n=document.getElementById('nav'),m=document.getElementById('m');
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]'),d=e.target.closest('[data-del]');
if(g)show(g.dataset.go);if(d){const[k,i]=d.dataset.del.split(':');(db[k][+i].imgs||[]).forEach(x=>IDBI('del',x).catch(()=>{}));db[k].splice(+i,1);save();show(cur)}
if(e.target.id=='sg'){db.g=document.getElementById('goal').value;save();e.target.textContent='ذخیره شد ✓'}
if(e.target.id=='rs'){try{const o=JSON.parse(document.getElementById('bi').value);if(!o||!Array.isArray(o.t))throw 0;db=o;['t','b','d'].forEach(k=>db[k]=db[k]||[]);db.r=db.r||{};db.g=db.g||'';save();show('home')}catch(x){e.target.textContent='متن نامعتبر است'}}});
document.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target),o={};
for(const k of new Set(fd.keys()))o[k]=['em','ch'].includes(k)?fd.getAll(k):fd.get(k);
const id=e.target.id;if(id=='f-trade'){o.imgs=await saveImgs(document.getElementById('chartf'));db.t.push(o)}else if(id=='f-day')db.d.push(o);else if(id=='f-bt')db.b.push(o);else if(id=='f-rules')db.r=o;
save();show(id=='f-trade'?'trade':id=='f-day'?'day':id=='f-bt'?'bt':'rules')});
show('home');fsInit();
</script></body></html>
